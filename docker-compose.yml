services:
  db:
    image: postgres:16-alpine
    container_name: tilbud-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tilbud}
      POSTGRES_USER: ${POSTGRES_USER:-tilbud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tilbud}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tilbud}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tilbud-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tilbud}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tilbud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tilbud}
      API_BASE_URL: ${API_BASE_URL:-https://api.etilbudsavis.dk/v2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tilbud-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  pgdata:
