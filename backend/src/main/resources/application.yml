spring:
  application:
    name: tilbud-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tilbud}
    username: ${SPRING_DATASOURCE_USERNAME:tilbud}
    password: ${SPRING_DATASOURCE_PASSWORD:tilbud}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  threads:
    virtual:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

api:
  base-url: ${API_BASE_URL:https://api.etilbudsavis.dk/v2}
