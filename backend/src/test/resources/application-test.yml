spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=POSTgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  threads:
    virtual:
      enabled: true

api:
  base-url: http://localhost:9999
